agents:
  agent.create_agent.0:
    type: factory
    models: [gemini-2.5-flash]
    tools: [query_user_transactions, run_discrepancy_check, send_message_to_remote_agent, get_transaction_status]
    params:
      name: SPARK_Host_Agent
      instruction: self.root_instruction
      generate_content_config:
        ref: generation_config
      description: SPARK Host Agent - AI-powered support for BPI transaction discrepancy resolution
      function: create_agent
      instance: agent.create_agent
  agent.create_agent.1:
    type: factory
    models: [gemini-2.5-flash]
    tools: [fetch_transaction_details, retry_transaction_tool]
    params:
      name: Reconciler_Agent
      instruction: get_reconciler_prompt()
      function: create_agent
      instance: agent.create_agent
      sub_agents: [escalator_agent]
  escalator_agent:
    type: instance
    models: [gemini-2.5-flash]
    tools: [fetch_transaction_for_report, save_generated_report]
    params:
      name: escalator_agent
      description: AI-powered report generation system that creates comprehensive, insightful reports for all transaction
        resolutions
      instruction: get_escalator_prompt()

models:
  gemini-2.5-flash:
    type: literal
    agents: [agent.create_agent.0, escalator_agent, agent.create_agent.1]

tools:
  fetch_transaction_details:
    type: function
    agents: [agent.create_agent.1]
    params:
      description: |-
        Fetch full details of a transaction from the database.
        This tool has read-only access to the transactions table.

        Args:
            transaction_id: The transaction ID to fetch details for
            user_id: Optional user ID for additional security filtering
            tool_context: The tool context from ADK

        Returns:
            Dictionary containing transaction details or error information
  fetch_transaction_for_report:
    type: function
    agents: [escalator_agent]
    params:
      description: |-
        Fetch comprehensive transaction data to enable LLM-based report generation.

        This tool retrieves all transaction details, retry attempts, and related data
        so the LLM can generate a comprehensive, contextual report.

        Args:
            transaction_id: The transaction ID to fetch data for
            tool_context: The tool context from ADK

        Returns:
            Dictionary containing all transaction data needed for report generation
  get_transaction_status:
    type: function
    agents: [agent.create_agent.0]
    params:
      module: self.get_transaction_status
      description: Get the current status of a transaction.
  query_user_transactions:
    type: function
    agents: [agent.create_agent.0]
    params:
      description: |-
        Query transactions for a specific user from the database.
        CRITICALLY SANDBOXED: Can ONLY query transactions where user_id matches the provided user_id.

        Args:
            user_id: The user ID to query transactions for
            limit: Optional limit on number of transactions to return
            tool_context: The tool context from ADK

        Returns:
            List of transaction dictionaries
  retry_transaction_tool:
    type: function
    agents: [agent.create_agent.1]
    params:
      description: |-
        Retry a failed transaction by creating a new transaction record.
        This tool enforces a retry limit of 2 attempts per original transaction.

        Args:
            transaction_id: The original transaction ID to retry
            user_id: Optional user ID (will be fetched from transaction if not provided)
            tool_context: The tool context from ADK

        Returns:
            Dictionary containing retry status and new transaction ID if successful
  run_discrepancy_check:
    type: function
    agents: [agent.create_agent.0]
    params:
      description: |-
        Run a discrepancy check on a specific transaction using the TRYBE ML model.

        Args:
            transaction_id: The transaction ID to check
            tool_context: The tool context from ADK

        Returns:
            Dictionary with discrepancy detection results
  save_generated_report:
    type: function
    agents: [escalator_agent]
    params:
      description: |-
        Save an LLM-generated report to the messages table.

        Args:
            transaction_id: The transaction ID this report is for
            report_content: The full markdown-formatted report content generated by the LLM
            report_type: Type of report (SUCCESS, ESCALATION, RISK_ESCALATION)
            priority: Priority level (LOW, MEDIUM, HIGH, CRITICAL)
            tool_context: The tool context from ADK

        Returns:
            Dictionary containing save status and report metadata
  send_message_to_remote_agent:
    type: function
    agents: [agent.create_agent.0]
    params:
      module: self.send_message_to_remote_agent
      description: Send a task to a remote agent (Reconciler or Escalator).

teams:
  agent.create_agent.1:
    type: hierarchy
    agents: [agent.create_agent.1, escalator_agent]

